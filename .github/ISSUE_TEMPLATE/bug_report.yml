name: "🐛 Bug report"
description: Reporta un comportamiento incorrecto de la extensión.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Antes de abrir, busca issues abiertos para no duplicar.
  - type: dropdown
    id: browser
    attributes:
      label: Navegador
      options:
        - Chrome
        - Edge
        - Firefox
        - Zen Browser
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de la extensión
      description: Si la cargaste desde código, indica el commit o rama.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Mínimo necesario para reproducir el bug.
      placeholder: |
        1. Ir a ...
        2. Clic en ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / capturas
      description: Consola del service worker (chrome://extensions → "service worker"), consola de la pestaña, o captura de pantalla.
      render: shell
    validations:
      required: false
